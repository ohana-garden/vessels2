[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:falkordb]
command=/usr/bin/redis-server --loadmodule /opt/falkordb/falkordb.so --port 6379 --dir /data/falkordb --appendonly yes
directory=/data/falkordb
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/falkordb.log
stderr_logfile=/var/log/supervisor/falkordb.err
startsecs=5

[program:tigerbeetle]
command=/usr/local/bin/tigerbeetle start --addresses=0.0.0.0:3000 /data/tigerbeetle/0_0.tigerbeetle
directory=/data/tigerbeetle
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/tigerbeetle.log
stderr_logfile=/var/log/supervisor/tigerbeetle.err
startsecs=5

[program:vessels]
command=python run_ui.py
directory=/vessels
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/vessels.log
stderr_logfile=/var/log/supervisor/vessels.err
startsecs=10
# Wait for databases to be ready
startretries=5

[eventlistener:startup_check]
command=/bin/true
events=PROCESS_STATE_RUNNING
