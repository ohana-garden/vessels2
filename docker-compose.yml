# Vessels Development Stack
# Usage: docker compose up -d
#
# TODO [PRODUCTION]: Remove external port bindings before release.
# FalkorDB (6379) and TigerBeetle (3000) are exposed for dev debugging only.
# Production should use internal networking only or add authentication.

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: vessels-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    container_name: vessels-tigerbeetle
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle-data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: |
      if [ ! -f /data/0_0.tigerbeetle ]; then
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle
      fi
      exec /tigerbeetle start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle

volumes:
  falkordb-data:
  tigerbeetle-data:
